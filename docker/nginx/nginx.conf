# docker/nginx/nginx.conf
events {
    worker_connections 1024;
}

http {
    upstream sermon_app {
        server sermon-processor:8504;
    }

    server {
        listen 80;
        server_name localhost;

        # Browser uploads are capped by SERMONPILOT_UPLOAD_GB; keep this at or
        # above it so the proxy never rejects a file the console would accept.
        client_max_body_size 2000M;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # The console serves both the SPA and /api from one upstream.
        location / {
            proxy_pass http://sermon_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket headers: the console polls over HTTP today, but keep
            # them so a live tail does not need a second config change.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Streaming downloads and large multipart uploads must not spool.
            proxy_buffering off;

            # Increase timeouts for large file uploads
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
        }
    }
}