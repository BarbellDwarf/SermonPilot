# SermonAudio Updater Configuration
# Settings load from the SQLite settings database, seeded from environment
# variables on first run (see README). No file is read at run time. This file
# is a reference showing every recognized key; a pre-database config.yaml (or
# the file named by SA_UPDATER_CONFIG) is imported into an empty database once.
#
# API-KEY CONTRACT: never store literal keys in this file. Every api_key
# below is a ${VAR} placeholder resolved from the environment at load time
# (see src/core/config.py). At runtime a key may also come from the UI-saved DB
# config_cache. Precedence is: environment > DB > built-in default.
# The Settings UI YAML export writes placeholders, never literals.
#
# Supported variables (see .env.example and docs/SECURITY_SETUP_GUIDE.md):
#   SERMONAUDIO_API_KEY, SERMONAUDIO_BROADCASTER_ID,
#   OPENAI_API_KEY, ANTHROPIC_API_KEY, XAI_API_KEY, GOOGLE_API_KEY,
#   GROQ_API_KEY, OPENROUTER_API_KEY,
#   AUTO_EDIT_LLM_API_KEY, AUTO_EDIT_LLM_BASE_URL,
#   OLLAMA_HOST, OLLAMA_MODEL, LLM_PROVIDER,
#   OPENAI_MODEL, ANTHROPIC_MODEL, XAI_MODEL, GOOGLE_MODEL, GROQ_MODEL,
#   OPENROUTER_MODEL, WHISPER_MODEL, TRANSCRIPTION_BACKEND,
#   OUTPUT_DIRECTORY, DRY_RUN, DEBUG, VERBOSE,
#   DATABASE_URL, SA_UPDATER_CONFIG.

# SermonAudio API credentials - Use environment variables for security
api_key: "${SERMONAUDIO_API_KEY}"
broadcaster_id: "${SERMONAUDIO_BROADCASTER_ID}"

# LLM Configuration
llm:
  # Primary LLM settings
  primary:
    provider: "ollama"  # Options: "ollama", "openai", "xai", "groq", "openrouter"
    ollama:
      host: "http://localhost:11434"
      model: "llama3"
      think: false  # Reasoning models only; false gives direct answers and avoids token-budget cutoffs
      # Context window and output budget. Cut detection sends a full timestamped
      # transcript and reasoning models (for example glm-5.3-flash:cloud) spend
      # output tokens thinking before the JSON answer. Defaults that are too low
      # truncate the prompt or produce an empty content field.
      num_ctx: 32768
      max_tokens: 16000
    openai:
      api_key: "${OPENAI_API_KEY}"
      model: "gpt-3.5-turbo"
      # base_url: "https://api.openai.com/v1"  # Optional: Custom endpoint for other providers
    xai:
      api_key: "${XAI_API_KEY}"
      model: "grok-beta"  # Default model, can be overridden
    groq:
      api_key: "${GROQ_API_KEY}"
      model: "llama-3.1-70b-versatile"  # Default model, can be overridden
  
  # Fallback LLM settings (used if primary fails)
  fallback:
    enabled: true
    provider: "openai"  # Options: "ollama", "openai", "xai", "groq", "openrouter"
    ollama:
      host: "http://localhost:11434"
      model: "llama2"
    openai:
      api_key: "${OPENAI_API_KEY}"
      model: "gpt-3.5-turbo"
      # base_url: "https://api.openai.com/v1"  # Optional: Custom endpoint for other providers
    xai:
      api_key: "${XAI_API_KEY}"
      model: "grok-beta"
    groq:
      api_key: "${GROQ_API_KEY}"
      model: "llama-3.1-8b-instant"  # Faster model for fallback
  
  # Validation LLM settings (smaller model for description validation)
  validator:
    enabled: true
    provider: "ollama"  # Options: "ollama", "openai", "xai", "groq", "openrouter"
    ollama:
      host: "http://localhost:11434"
      model: "gemma2:2b"  # Smaller, faster model for validation
    openai:
      api_key: "${OPENAI_API_KEY}"
      model: "gpt-4o-mini"  # Smaller OpenAI model for validation
      # base_url: "https://api.openai.com/v1"  # Optional: Custom endpoint
    groq:
      api_key: "${GROQ_API_KEY}"
      model: "llama-3.1-8b-instant"  # Fast model for validation

  # Operation-scoped LLM pins (optional). If absent for an operation,
  # that operation uses the global primary/fallback chain above.
  # Example: pin auto-edit cut detection to a dedicated OpenAI-compatible
  # endpoint. Uncomment and fill in to use it; otherwise detection runs on
  # the primary chain (for example Ollama glm-5.3-flash:cloud).
  # operations:
  #   auto_edit:
  #     provider: "openai"
  #     openai:
  #       api_key: "${AUTO_EDIT_LLM_API_KEY}"
  #       base_url: "${AUTO_EDIT_LLM_BASE_URL}"
  #       model: "your-model"
  #       extra_headers:
  #         x-opencode-session: "sermonpilot-auto-edit"

# Audio Processing Settings
audio_enhancement_method: "deepfilternet"  # Options: "deepfilternet", "clear-natural", "clear-studio", "none"
preprocess_noise_gate: false  # Legacy pre-enhancement noise gate; keep false (it destroyed sermon speech)
audio_noise_reduction: true
audio_amplify: true
audio_normalize: true
audio_gain_db: 0.5
audio_target_level_db: -22.0

# Enhancement compute placement
enhancement:
  # auto: run DeepFilterNet on CPU when the GPU's total VRAM is below
  # min_gpu_vram_gb, so whisper keeps the card. cpu: always enhance on CPU
  # (slower, but leaves the GPU free for transcription). cuda: always enhance
  # on the GPU (fastest, needs room for enhancement and whisper together).
  device: "auto"
  # Total-VRAM floor for device: auto. Below this, enhancement runs on CPU.
  min_gpu_vram_gb: 12

# Processing Options
dry_run: false  # Set to true to preview changes without updating
debug: false    # Set to true to enable verbose debug output
hashtag_verification: true  # Set to true to verify hashtags through a second LLM pass (recommended)

# Output Settings
output_directory: "processed_sermons"  # Directory to store processed sermon files (relative to script or absolute path)
# Job Queue - a queued job starts only when the host has free resources
job_queue:
  min_free_ram_gb: 3.0   # Wait while free RAM is below this
  min_free_vram_gb: 1.5  # Wait while free GPU VRAM is below this (when CUDA is available)

save_original_audio: true  # Save the original downloaded audio file alongside processed audio
save_transcript: true  # Save the sermon transcript as a text file alongside other outputs

# Temporary Job Storage (optional)
# Unset keys fall back to a disk-backed folder under the user cache root
# ($XDG_CACHE_HOME/sermonpilot or ~/.cache/sermonpilot); the previous fallback
# was the system temp dir, which is tmpfs (RAM) on many Linux systems.
upload_dir: "/var/tmp/sermonpilot/uploads"  # Staging area for files uploaded through the web UI
processing_temp_dir: "/var/tmp/sermonpilot/processing"  # Parent for per-job audio processing temp dirs

# Metadata Processing Settings
metadata_processing:
  enabled: true  # Enable metadata processing (descriptions and hashtags)
  process_audio: true  # Whether to process audio (can be overridden by CLI)
  description:
    update_if_missing: true  # Update only if null/empty
    update_if_minimal: true  # Update if less than min_length_threshold chars
    force_update: false     # Update even if substantial content exists
    min_length_threshold: 50  # Characters to consider "minimal"
    validation:
      enabled: true  # Enable description validation with smaller model
      criteria:
        - "Contains specific theological content or Bible references"
        - "Mentions the speaker's main message or key points"
        - "Is written in a professional, engaging style"
        - "Avoids generic Christian phrases without substance"
        - "Has clear application or takeaway for listeners"
  hashtags:
    update_if_missing: true  # Update only if null/empty  
    update_if_minimal: true  # Update if less than min_length_threshold chars
    force_update: false     # Update even if substantial content exists
    min_length_threshold: 10  # Characters to consider "minimal"

# Transcription Settings
# Cloud backends read their key from the environment (preferred) or the DB
# config_cache. Keep the ${VAR} placeholders here; short or empty values are
# treated as unset and never sent to an endpoint.
transcription:
  # Backend precedence: an explicit value here (or a caller/CLI override) always
  # wins. Leave this unset or set it to "auto" to pick automatically: when the
  # optional faster-whisper (CTranslate2) package is importable the lighter,
  # lower-VRAM faster_whisper_local path is used; otherwise the code falls back
  # to whisper_local (openai-whisper, which runs fp16 on CUDA and drops to CPU
  # on a CUDA out-of-memory).
  backend: faster_whisper_local  # Options: auto, whisper_local, faster_whisper_local, whisper_openai, whisper_openrouter
  # Compute type for local Whisper. auto = int8 on cpu, float16 on cuda (an
  # 8 GB card cannot hold a float32 large model). Pin one of the explicit
  # values to override; cuda loads still step down the ladder on OOM.
  compute_type: auto  # Options: auto, float16, int8_float16, int8, float32
  whisper_local:
    device: auto  # Options: auto, cpu, cuda
    language: en  # Language code (en, es, fr, etc.) or None for auto-detection
    model: base  # Options: tiny, base, small, medium, large (or ${WHISPER_MODEL})
  faster_whisper_local:
    compute_type: auto  # Legacy per-backend override; transcription.compute_type wins
    device: auto  # Options: auto, cpu, cuda
    language: en  # Language code (en, es, fr, etc.) or None for auto-detection
    model: base  # Options: tiny, base, small, medium, large (or ${WHISPER_MODEL})
  whisper_openai:
    api_key: "${OPENAI_API_KEY}"  # Or set OPENAI_API_KEY in the environment
    base_url: https://api.openai.com/v1  # OpenAI API base URL
    model: whisper-1  # Options: whisper-1
  whisper_openrouter:
    api_key: "${OPENROUTER_API_KEY}"  # Or set OPENROUTER_API_KEY in the environment
    base_url: https://openrouter.ai/api/v1  # OpenRouter API base URL
    model: openai/whisper-large-v3  # Options: openai/whisper-large-v3, etc.

# Auto-Edit Settings (see docs/AUTO_EDIT.md)
auto_edit:
  enabled: false  # Master switch for LLM cut detection and editing
  mode: interactive  # interactive: stop at pending_review | auto: apply when confident
  auto_confidence_threshold: 0.8  # Minimum LLM confidence for auto mode (clamped to <= 0.99)
  qa_margin_seconds: 3.0  # Padding kept around the Q&A boundary
  min_sermon_seconds: 600  # Plans leaving less than this fail validation and go to review
  require_review: true  # Legacy: true behaves as interactive when mode is absent
  logo_path: ''  # Image for the end card; empty disables the card
  logo_hold: 3.0  # Seconds the logo card stays on screen
  fade_to_black: true  # Fade out at the end of the content
  fade_out_tail_seconds: 2.0  # Extra source audio kept past the end cut so the
    # delayed audio tail and the end fade clear the closing words (clamped to room)
  keeper:
    enabled: true  # Shrink large raw sources before processing
    crf: 20  # libx264 -crf / nvenc -cq / vaapi -qp (crf+2)
    nvenc: true  # Encoder detect chain: nvenc -> vaapi (Intel+AMD) -> libx264
    delete_original: false  # Delete the raw source after a verified transcode and applied edit
    min_source_gb: 2.0  # Only transcode sources at or above this size

# Ingest Watcher (#283) - notify when new recordings land on a cloud remote
#
# A standalone poller that watches ONE per-user rclone remote and sends a
# Signal notification when a new, stable recording appears. It never
# downloads or processes files. Run it with:
#
#   python -m src.ingest_watcher
#
# The remote is read through the user's own rclone config at
# $SERMONPILOT_RCLONE_DIR/<user_id>/config (Settings > Cloud Mounts), so no
# host bind-mount is involved. Docker launches the watcher only when
# INGEST_WATCHER_ENABLED is truthy (default off); setting enabled: true alone
# does not start it inside the container.
#
# Signal gateway credentials come from the environment only:
#   INGEST_SIGNAL_URL         default http://localhost:8080
#   INGEST_SIGNAL_SENDER      sending number/group id
#   INGEST_SIGNAL_RECIPIENTS  comma-separated numbers/group ids
# With sender/recipients unset the watcher logs "notify disabled" and only
# records detections in its state file.
ingest_watcher:
  enabled: false  # DEFAULT off; existing deployments are unchanged
  remote: ""  # rclone remote NAME, e.g. "cloud-remote"
  user_id: ""  # whose rclone config to read; typically the admin account
  watch_subpath: ""  # path inside the remote, e.g. "Sermon Audio/"
  poll_interval_seconds: 60
  # A file must keep the same size AND modtime for this long, across at least
  # two polls, before it is announced (cloud writes are slow).
  stability_window_seconds: 300
  size_floor_mb: 50  # ignore files smaller than this
  extension_allowlist:  # files outside this list are ignored
    - .mkv
    - .mp4
    - .mov
    - .m4a
    - .wav
  state_file: /data/ingest_watcher_state.json  # first-seen/last-seen bookkeeping
  signal:
    url: "${INGEST_SIGNAL_URL}"
    sender: "${INGEST_SIGNAL_SENDER}"
    recipients: "${INGEST_SIGNAL_RECIPIENTS}"
