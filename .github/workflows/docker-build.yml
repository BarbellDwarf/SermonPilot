name: Build and Push Docker Images

# Actions are pinned to commit SHAs of their release tags to prevent
# supply-chain tampering; the tag is noted in a trailing comment.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      gpu_backend:
        description: 'GPU backend to build'
        type: choice
        options:
          - all
          - cuda
          - rocm
          - cpu
        default: all

concurrency:
  group: docker-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      matrix:
        gpu: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (github.event.inputs.gpu_backend == 'cuda' && '["cuda"]' || github.event.inputs.gpu_backend == 'rocm' && '["rocm"]' || github.event.inputs.gpu_backend == 'cpu' && '["cpu"]' || '["cuda", "rocm", "cpu"]') || '["cuda", "rocm", "cpu"]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Lowercase repository name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        # Any v-tag ref counts as a release build, including a
        # workflow_dispatch on the tag (release.yml dispatches the build
        # after cutting the tag, since token-pushed refs fire no events).
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "publish_moving=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
            echo "publish_moving=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          push: ${{ matrix.gpu != 'cpu' }}
          load: ${{ matrix.gpu == 'cpu' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-${{ matrix.gpu }}
            ${{ steps.version.outputs.publish_moving == 'true' && format('{0}/{1}:{2}', env.REGISTRY, env.IMAGE_NAME, matrix.gpu) || '' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.description=SermonPilot (${{ matrix.gpu }})
          build-args: |
            GPU_BACKEND=${{ matrix.gpu }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container (cpu)
        if: matrix.gpu == 'cpu'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-cpu"
          docker run -d --name sermonpilot-smoke \
            --health-cmd "curl -f http://localhost:8501/ || exit 1" \
            --health-interval 5s --health-retries 3 --health-start-period 15s \
            -p 8501:8501 "$IMAGE"
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' sermonpilot-smoke 2>/dev/null)" != "true" ]; then
              docker logs sermonpilot-smoke 2>/dev/null || true
              docker rm -f sermonpilot-smoke >/dev/null 2>&1 || true
              echo "Smoke test failed: container exited"
              exit 1
            fi
            status="$(docker inspect -f '{{.State.Health.Status}}' sermonpilot-smoke 2>/dev/null || echo starting)"
            if [ "$status" = "healthy" ]; then
              echo "Smoke test passed"
              docker rm -f sermonpilot-smoke >/dev/null 2>&1 || true
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs sermonpilot-smoke 2>/dev/null || true
              docker rm -f sermonpilot-smoke >/dev/null 2>&1 || true
              echo "Smoke test failed: container unhealthy"
              exit 1
            fi
            sleep 5
          done
          docker logs sermonpilot-smoke 2>/dev/null || true
          docker rm -f sermonpilot-smoke >/dev/null 2>&1 || true
          echo "Smoke test failed: timed out waiting for healthy"
          exit 1

      - name: Push cpu image
        if: matrix.gpu == 'cpu'
        run: |
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-cpu"
          if [[ "${{ steps.version.outputs.publish_moving }}" == "true" ]]; then
            docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cpu"
          fi

  tag-latest:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Lowercase repository name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag cuda as latest
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-cuda
