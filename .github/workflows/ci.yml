name: CI

# Actions are pinned to commit SHAs of their release tags to prevent
# supply-chain tampering; the tag is noted in a trailing comment.

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements/requirements.txt

      - name: Install dependencies
        # The fast suite (-m "not heavy") imports only these packages, so the
        # full requirements set (torch, whisper, chromadb, ...) stays out of CI.
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest requests python-dotenv PyYAML streamlit
          pip install -e . --no-deps

      - name: Lint with ruff
        run: ruff check .

      - name: Run fast tests
        # Heavy tests (model downloads, GPU, long audio) are marked with
        # pytest.mark.heavy and skipped here; the T-TESTS ticket makes the
        # fast subset runnable without heavy dependencies.
        run: python -m pytest -m "not heavy" --junitxml=pytest-report.xml

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore
