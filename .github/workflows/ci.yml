name: CI

# Actions are pinned to commit SHAs of their release tags to prevent
# supply-chain tampering; the tag is noted in a trailing comment.

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements/requirements.txt

      - name: Install dependencies
        # The fast suite (-m "not heavy") imports only these packages, so the
        # full requirements set (torch, whisper, ...) stays out of CI.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install ruff pytest requests python-dotenv PyYAML streamlit fastapi httpx
          pip install -e . --no-deps

      - name: Lint with ruff
        run: ruff check .

      - name: Build web bundle (SPA tests need web/dist)
        run: |
          cd web
          npm ci --no-audit --no-fund
          npm run build

      - name: Test web components
        run: |
          cd web
          npm test

      - name: Run fast tests
        # Heavy tests (model downloads, GPU, long audio) are marked with
        # pytest.mark.heavy and skipped here; the T-TESTS ticket makes the
        # fast subset runnable without heavy dependencies.
        run: python -m pytest -m "not heavy" --junitxml=pytest-report.xml

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore
