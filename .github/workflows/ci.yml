name: CI

# Actions are pinned to commit SHAs of their release tags to prevent
# supply-chain tampering; the tag is noted in a trailing comment.

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -r requirements/requirements.txt
          pip install -e . --no-deps

      - name: Lint with ruff
        run: ruff check .

      - name: Run fast tests
        # Heavy tests (model downloads, GPU, long audio) are marked with
        # pytest.mark.heavy and skipped here; the T-TESTS ticket makes the
        # fast subset runnable without heavy dependencies.
        run: python -m pytest -m "not heavy" --junitxml=pytest-report.xml

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore
