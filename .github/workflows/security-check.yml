name: Security Compliance Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

    - name: Set up Python
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    - name: Validate configuration security
      env:
        # Placeholders only: the validator checks that config.yaml has no
        # hardcoded secrets. Real values never reach CI.
        SERMONAUDIO_API_KEY: placeholder-ci-check
        SERMONAUDIO_BROADCASTER_ID: placeholder-ci-check
        PRODUCTION_MODE: "false"
      run: |
        echo "🔧 Validating configuration security..."
        python src/secure_config.py

  credential-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

    - name: Scan for secrets
      uses: trufflesecurity/trufflehog@abecab0d8fb9fb3e79366abc3909825488e9bb40  # v3.82.12
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD

  dependency-security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

    - name: Set up Python
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit

    - name: Check for known vulnerabilities
      run: |
        echo "🔍 Checking for known vulnerabilities in dependencies..."
        safety check --json

    - name: Run Bandit security linter
      run: |
        echo "🔒 Running Bandit security linter..."
        bandit -r src/ sermon_updater.py ui/ -f json -o bandit_report.json

    - name: Upload Bandit report
      if: always()
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
      with:
        name: bandit-security-report
        path: bandit_report.json
