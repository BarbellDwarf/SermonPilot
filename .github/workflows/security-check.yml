name: Security Compliance Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

    - name: Set up Python
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    - name: Validate configuration security
      run: |
        echo "🔧 Validating configuration security..."
        python - <<'EOF'
        import sys
        import yaml

        cfg = yaml.safe_load(open("config.yaml"))
        if not isinstance(cfg, dict):
            print("config.yaml is empty or invalid")
            sys.exit(1)

        def walk(d, path):
            bad = []
            for k, v in d.items():
                p = f"{path}.{k}" if path else k
                if isinstance(v, dict):
                    bad += walk(v, p)
                elif isinstance(v, str) and "key" in p.lower():
                    v = v.strip()
                    if v and not v.startswith("${") and v != "your-api-key-here":
                        bad.append(f"{p}")
            return bad

        bad = walk(cfg, "")
        if bad:
            print("Hardcoded secret values found in config.yaml:")
            for b in bad:
                print(f"  - {b}")
            sys.exit(1)
        print("OK: no hardcoded secrets in config.yaml")
        EOF

  credential-scan:
    runs-on: ubuntu-latest
    # Trufflehog's BASE/HEAD scan needs two distinct commits; on pushes to
    # master (base == head) it errors out. PRs are where the scan has value.
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

    - name: Scan for secrets
      uses: trufflesecurity/trufflehog@abecab0d8fb9fb3e79366abc3909825488e9bb40  # v3.82.12
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD

  dependency-security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

    - name: Set up Python
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit pip-audit

    - name: Check for known vulnerabilities
      # NON-GATING until the dependency cleanup (wayfinder/TKT-64) and torch
      # evaluation (wayfinder/TKT-69) land: pip-audit currently flags the 78
      # known advisories (46 torch, GitPython, starlette, etc.) that those
      # tickets fix. Flip to gating once the manifests are clean.
      continue-on-error: true
      run: |
        echo "🔍 Checking for known vulnerabilities in dependencies..."
        pip-audit -r requirements/requirements.txt || true
        pip-audit -r requirements/requirements-rocm.txt --skip-editable || true

    - name: Run Bandit security linter
      # NON-GATING: pre-existing findings; flip to gating once the lint pass
      # (wayfinder/TKT-68) and scanning gates (wayfinder/TKT-61) land.
      continue-on-error: true
      run: |
        echo "🔒 Running Bandit security linter..."
        bandit -r src/ sermon_updater.py ui/ -f json -o bandit_report.json

    - name: Upload Bandit report
      if: always()
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
      with:
        name: bandit-security-report
        path: bandit_report.json
