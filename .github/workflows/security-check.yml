name: Security Compliance Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

    - name: Set up Python
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    - name: Validate configuration security
      run: |
        echo "Validating configuration security..."
        python - <<'EOF'
        import sys
        import yaml

        # config.yaml is untracked (runtime artifact); validate the committed
        # example, which is the artifact contributors actually change.
        path = "config/config.example.yaml"
        cfg = yaml.safe_load(open(path))
        if not isinstance(cfg, dict):
            print(f"{path} is empty or invalid")
            sys.exit(1)

        def walk(d, path):
            bad = []
            for k, v in d.items():
                p = f"{path}.{k}" if path else k
                if isinstance(v, dict):
                    bad += walk(v, p)
                elif isinstance(v, str) and "key" in p.lower():
                    v = v.strip()
                    if v and not v.startswith("${") and v != "your-api-key-here":
                        bad.append(f"{p}")
            return bad

        bad = walk(cfg, "")
        if bad:
            print(f"Hardcoded secret values found in {path}:")
            for b in bad:
                print(f"  - {b}")
            sys.exit(1)
        print(f"OK: no hardcoded secrets in {path}")
        EOF

  credential-scan:
    runs-on: ubuntu-latest
    # Trufflehog's BASE/HEAD scan needs two distinct commits; on pushes to
    # master (base == head) it errors out. PRs are where the scan has value.
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

    - name: Scan for secrets
      uses: trufflesecurity/trufflehog@abecab0d8fb9fb3e79366abc3909825488e9bb40  # v3.82.12
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD

  dependency-security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

    - name: Set up Python
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit

    - name: Install osv-scanner
      run: |
        curl -sSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
        echo "f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be  osv-scanner" | sha256sum -c -
        chmod +x osv-scanner

    - name: Install uv
      run: pip install uv

    - name: Check for known vulnerabilities (lockfile)
      # Audit the authoritative dev lock. See osv-scanner.toml for the
      # documented exceptions (chromadb latest-with-no-fix, torch on the
      # cu124 GPU stack).
      run: |
        echo "Checking the lockfile for known vulnerabilities..."
        ./osv-scanner scan --lockfile uv.lock

    - name: Check for known vulnerabilities (production resolution)
      # Docker installs from the requirements floors, so resolve them the same
      # way at build time and audit that exact set.
      run: |
        echo "Checking the production resolution for known vulnerabilities..."
        uv pip compile requirements/requirements.txt -o /tmp/prod-requirements.txt --quiet
        ./osv-scanner scan --lockfile /tmp/prod-requirements.txt

    - name: Run Bandit security linter
      # -lll fails the job on HIGH severity findings only; the
      # pre-existing MEDIUM/LOW findings are reported in the artifact.
      run: |
        echo "Running Bandit security linter..."
        bandit -r src/ ui/ sermon_updater.py streamlit_app.py -lll -f json -o bandit_report.json

    - name: Upload Bandit report
      if: always()
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
      with:
        name: bandit-security-report
        path: bandit_report.json
