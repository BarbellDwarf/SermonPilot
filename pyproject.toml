[project]
name = "sermon-audio-updater"
version = "1.6.0"
description = "Automated sermon processing tool for SermonAudio"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # Core API and configuration
    "sermonaudio>=1.0.0",
    "requests>=2.34.2",
    "PyYAML>=6.0",
    "python-dotenv>=1.2.2",
    # Audio processing core
    "pydub>=0.25.1",
    "numpy>=1.26.2",
    "scipy>=1.11.4",
    "soundfile>=0.12.1",
    "librosa>=0.10.1",
    "mutagen>=1.47.0",
    # PyTorch ecosystem (single pin; per-index override files in requirements/)
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    # AI enhancement models
    "deepfilternet>=0.5.6",
    "onnxruntime>=1.22.1",
    "huggingface-hub>=0.20.0",
    # Transcription
    "openai-whisper>=20231117",
    "faster-whisper>=1.0.0",
    # LLM providers
    "ollama>=0.1.0",
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "cohere>=4.0.0",
    "voyageai>=0.2.0",
    # UI and analytics
    "streamlit>=1.36.0",
    "plotly>=6.3.0",
    "chromadb>=1.5.9",
    "sentence-transformers>=2.2.0",
    "pandas>=2.1.3",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
# Audacity integration (optional)
audacity = ["PyAudacity>=0.1.3"]
# Development tools
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "pylint>=2.15.0",
    "ruff>=0.1.0",
]
# All optional dependencies
all = [
    "sermon-audio-updater[audacity,dev]"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "ui"]

[tool.hatch.build.targets.wheel.force-include]
"sermon_updater.py" = "sermon_updater.py"
"streamlit_app.py" = "streamlit_app.py"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "pylint>=2.15.0",
    "ruff>=0.1.0",
    # Note: Optional AI models like voicefixer, speechbrain, demucs
    # and deepspeed should be installed manually due to complex dependencies
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
markers = [
    "heavy: requires network, audio, or GPU resources; skipped by default (use --run-heavy)",
]
